[project]
name = "python-projects"
version = "0.1.0"
description = "Shared Python learning workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "cryptography>=42.0.0",
    "fastapi==0.136.0",
    "httpx==0.28.1",
    "memory-profiler==0.61.0",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "pyfiglet==1.0.2",
    "python-dotenv==1.2.2",
    "termcolor==2.4.0",
    "uvicorn==0.44.0",
]

[project.scripts]
cache-proxy = "cache_proxy.main:cli"

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cache_proxy*"]
